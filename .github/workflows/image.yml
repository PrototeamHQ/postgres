name: image

# Builds and tests the image for linux/amd64 and linux/arm64, each on a native runner, on every push and
# pull request, and publishes it from main as ghcr.io/prototeamhq/postgres:<postgres minor>-<build number>,
# one tag over both architectures (README.md#building-and-publishing).
on:
  push:
    branches: [main]
  pull_request:
  # A merge the AI review makes with the workflow's own token pushes without starting a workflow, so the review sends
  # this event once it merged (protobase-community/.github's .github/ai-review/announce.ts). It always runs on main, and
  # its payload names the branch the merge went into.
  repository_dispatch:
    types: [pull_request_merged]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    if: ${{ github.event_name != 'repository_dispatch' || github.event.client_payload.base == 'main' }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    concurrency:
      group: image-${{ matrix.arch }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: true
    runs-on: ${{ matrix.runner }}
    env:
      LOCAL_IMAGE: postgres-image:${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Build
        run: docker build -t "$LOCAL_IMAGE" .

      - name: Test
        env:
          TEST_POSTGRES_IMAGE: ${{ env.LOCAL_IMAGE }}
        run: bun test

      # The publish job pushes these exact tested images, so only it holds packages: write.
      - name: Save
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: docker save "$LOCAL_IMAGE" | zstd -T0 > image-${{ matrix.arch }}.tar.zst

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: image-${{ matrix.arch }}.tar.zst
          archive: false
          retention-days: 1

  publish:
    needs: image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: image-amd64.tar.zst

      - uses: actions/download-artifact@v8
        with:
          name: image-arm64.tar.zst

      # Takes the tags the images were saved under, which a re-run of this job alone does not change.
      - name: Load
        run: |
          for arch in amd64 arm64; do
            image=$(zstd -dc "image-$arch.tar.zst" | docker load | sed -n 's/^Loaded image: //p')
            echo "LOCAL_IMAGE_${arch^^}=$image" >> "$GITHUB_ENV"
          done

      # Build numbers continue the image's earlier builds, which published up to 18.6-2, so a tag
      # never moves to another image. Each architecture's image is pushed under the new tag in turn,
      # only to put it in the repository by digest, and the tag then ends on the manifest list of both.
      - name: Publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          minor=$(docker run --rm "$LOCAL_IMAGE_AMD64" postgres --version | sed -E 's/^postgres \(PostgreSQL\) ([0-9]+\.[0-9]+).*/\1/')
          repo=ghcr.io/prototeamhq/postgres
          tag="$repo:$minor-$(( ${{ github.run_number }} + 2 ))"
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          sources=()
          for image in "$LOCAL_IMAGE_AMD64" "$LOCAL_IMAGE_ARM64"; do
            docker tag "$image" "$tag"
            digest=$(docker push "$tag" | sed -En 's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p')
            sources+=("$repo@$digest")
          done
          docker buildx imagetools create -t "$tag" "${sources[@]}"
          echo "Published \`$tag@$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -r .digest)\`" >> "$GITHUB_STEP_SUMMARY"
