# Nobody logs in as postgres: the tenant, acting as postgres through its login role, can give it a
# password, and postgres has no connection limit, so a login as it would get round the login role's.
# pg_cron and pg_net run as postgres in background workers, which never read this file.
# Every other connection logs in with a password, loopback and the socket included: a tenant's
# dblink or postgres_fdw connection to localhost must never log in as another role without one.
# TYPE  DATABASE  USER      ADDRESS  METHOD
local   all       postgres           reject
host    all       postgres  all      reject
local   all       all                scram-sha-256
host    all       all       all      scram-sha-256
