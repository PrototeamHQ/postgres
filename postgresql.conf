# The image's server settings (README.md). initdb's own file in PGDATA comes first, and
# whoever runs the image adds its own in /etc/postgresql-custom/conf.d, which comes last.
data_directory = '/var/lib/postgresql/18/docker'
hba_file = '/etc/postgresql/pg_hba.conf'
ident_file = '/var/lib/postgresql/18/docker/pg_ident.conf'
include '/var/lib/postgresql/18/docker/postgresql.conf'

# The background workers, the root key and the hooks these extensions need are set up only at
# server start.
shared_preload_libraries = 'pg_stat_statements, pgaudit, plpgsql, plpgsql_check, pg_cron, pg_net, pgsodium, auto_explain, pg_tle, plan_filter, supabase_vault'
session_preload_libraries = 'supautils'

# The root key comes from outside the container (getkey.sh).
pgsodium.getkey_script = '/usr/lib/postgresql/bin/pgsodium_getkey.sh'
vault.getkey_script = '/usr/lib/postgresql/bin/pgsodium_getkey.sh'

# pg_cron and pg_net each serve one database, the tenant's. pg_cron runs jobs in background workers
# rather than over a libpq connection to localhost, so pg_hba.conf needs no loopback trust.
cron.database_name = 'postgres'
cron.use_background_workers = on
max_worker_processes = 16
pg_net.database_name = 'postgres'
pg_net.username = 'postgres'

# plpgsql_check preallocates its profiler's shared statistics, about 29 MB at its defaults.
plpgsql_check.max_stats_size = 1024

include = '/etc/postgresql-custom/supautils.conf'
include_dir = '/etc/postgresql-custom/conf.d'
